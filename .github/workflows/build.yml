name: Build
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: test -z "$(git status --porcelain -- web/dist)"
      - run: npm run typecheck --prefix web
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: docker build -t rollbook:test .

  publish:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare image tags and version
        id: meta
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            short_sha="${GITHUB_SHA:0:7}"
            {
              echo 'publish=true'
              echo 'version=main'
              echo 'tags<<EOF'
              echo "$image:main"
              echo "$image:sha-$short_sha"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            {
              echo 'publish=true'
              echo "version=$GITHUB_REF_NAME"
              echo 'tags<<EOF'
              echo "$image:$GITHUB_REF_NAME"
              echo "$image:$minor"
              echo "$image:latest"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
        if: steps.meta.outputs.publish == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.meta.outputs.publish == 'true'
      - uses: docker/login-action@v3
        if: steps.meta.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.meta.outputs.publish == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ROLLBOOK_VERSION=${{ steps.meta.outputs.version }}
            ROLLBOOK_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Build release archives
        if: startsWith(github.ref, 'refs/tags/') && steps.meta.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="rollbook_${GITHUB_REF_NAME}_${os}_${arch}"
            suffix=''
            if [[ $os == windows ]]; then suffix='.exe'; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X github.com/CosmoGao/rollbook/internal/buildinfo.Version=$GITHUB_REF_NAME -X github.com/CosmoGao/rollbook/internal/buildinfo.Commit=$GITHUB_SHA" \
              -o "dist/rollbook$suffix" ./cmd/rollbook
            tar -C dist -czf "dist/$name.tar.gz" "rollbook$suffix"
            rm "dist/rollbook$suffix"
          done
          cp install.sh dist/install.sh
          (cd dist && sha256sum *.tar.gz install.sh > SHA256SUMS)
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') && steps.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
