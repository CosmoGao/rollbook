services:
  secret-init:
    image: alpine:3.21
    command: ["sh", "-ec", "cp /run/secrets/auth_pepper /secret-data/auth_pepper && chown 10001:10001 /secret-data/auth_pepper /backups && chmod 0400 /secret-data/auth_pepper"]
    secrets:
      - auth_pepper
    volumes:
      - rollbook-secret:/secret-data
      - rollbook-backups:/backups
    restart: "no"

  rollbook:
    image: ghcr.io/cosmogao/rollbook:${ROLLBOOK_VERSION:-latest}
    entrypoint: ["/usr/local/bin/rollbook"]
    command: ["serve"]
    ports:
      - "${ROLLBOOK_BIND_ADDR:-127.0.0.1}:${ROLLBOOK_PORT:-8080}:8080"
    environment:
      ROLLBOOK_AUTH_PEPPER_FILE: /run/secrets/auth_pepper
      ROLLBOOK_ALLOW_INSECURE_HTTP: ${ROLLBOOK_ALLOW_INSECURE_HTTP:-false}
      ROLLBOOK_BACKUP_DIR: ${ROLLBOOK_BACKUP_DIR:-}
      ROLLBOOK_BACKUP_INTERVAL: ${ROLLBOOK_BACKUP_INTERVAL:-}
      ROLLBOOK_BACKUP_WEEKLY_INTERVAL: ${ROLLBOOK_BACKUP_WEEKLY_INTERVAL:-}
      ROLLBOOK_BACKUP_DAILY_KEEP: ${ROLLBOOK_BACKUP_DAILY_KEEP:-}
      ROLLBOOK_BACKUP_WEEKLY_KEEP: ${ROLLBOOK_BACKUP_WEEKLY_KEEP:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - rollbook-data:/data
      - rollbook-backups:/backups
      - rollbook-secret:/run/secrets:ro
    depends_on:
      secret-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  rollbook-data:
  rollbook-backups:
  rollbook-secret:

secrets:
  auth_pepper:
    file: ./secrets/auth_pepper
