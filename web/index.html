<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rollbook 清册</title><link rel="stylesheet" href="/style.css">
</head>
<body>
<label class="language-control"><span class="sr-only">Language / 语言</span><select id="language" aria-label="Language / 语言"><option value="zh-CN">中文</option><option value="en">English</option></select></label>
<div id="login" class="login-wrap" hidden><form id="login-form" class="login-card"><div class="brand-mark">R</div><p class="eyebrow">ROLLBOOK / 清册</p><h1>登录清册</h1><p class="muted">用管理员账号查看服务与资产。</p><p class="http-mode-notice" hidden>当前为 HTTP 模式：口令和 Key 会在网络中明文传输，仅限可信内网使用。</p><label>账号<input name="login" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">登录</button><p id="login-error" class="error" role="alert"></p></form></div>
<div id="app" class="shell" hidden>
<aside class="sidebar"><div class="logo"><span class="brand-mark">R</span><div><strong>Rollbook</strong><small>服务与资产清册</small></div></div><div class="nav-heading">工作台</div><nav id="nav"><button data-view="search" class="active">⌕ <span>全局搜索</span></button><button data-view="assets">＋ <span>资产维护</span></button><button data-view="sites">◫ <span>站点</span></button><button data-view="hosts">▣ <span>主机</span></button><button data-view="networks">▤ <span>网段</span></button><div class="nav-heading">关注</div><button data-view="outdated">↗ <span>有新版本</span></button><button data-view="pending">◷ <span>待确认</span></button><button data-view="changes">◴ <span>最近变更</span></button><button data-view="contexts">▤ <span>共享上下文</span></button><button data-view="unverified">◇ <span>待核实</span></button><div class="nav-heading">管理</div><button data-view="keys">⚿ <span>Key 管理</span></button><button data-view="backup">⬇ <span>备份与恢复</span></button></nav><p class="http-mode-notice sidebar-http-notice" hidden>当前为 HTTP 模式</p><div class="sidebar-foot"><span id="user-name"></span><button id="change-password" title="修改密码">改密码</button><button id="logout-all" title="退出所有设备">退出所有设备</button><button id="logout" title="退出登录">退出</button><small id="build-version"></small></div></aside>
<div class="main"><header class="topbar"><div class="crumb">清册 <span>/</span> <b id="crumb">全局搜索</b></div><div class="top-actions"><span class="status-dot"></span> 内网工作台</div></header><main id="content" class="content"></main></div></div>
<script src="/i18n.js" defer></script>
<script src="/dagre.min.js" defer></script>
<script src="/topology.js" defer></script>
<script src="/marked.umd.js" defer></script>
<script src="/purify.min.js" defer></script>
<script src="/app.js" defer></script>
</body></html>
